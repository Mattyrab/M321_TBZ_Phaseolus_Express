# Host-based routing for the admin UIs, so a developer can reach everything
# through one or two long-lived port-forwards to Traefik instead of a
# separate port-forward per tool. Needs a one-time hosts-file entry per
# hostname pointing at 127.0.0.1 -- see setup.sh's final summary for the
# exact entries and port-forward commands.
#
# Explicit priority so these Host-matched routes aren't shadowed by (or
# don't shadow) beanapp's existing bare PathPrefix(`/`) route on the same
# "web" entrypoint, which has no Host constraint and would otherwise match
# any of these hostnames too.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: infra
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.phaseolus.local`)
      kind: Rule
      priority: 100
      services:
        - name: prometheus-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq-ingress
  namespace: infra
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rabbitmq.phaseolus.local`)
      kind: Rule
      priority: 100
      services:
        - name: rabbitmq
          port: 15672
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-ingress
  namespace: infra
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`keycloak.phaseolus.local`)
      kind: Rule
      priority: 100
      services:
        - name: keycloak
          port: 80
---
# argocd-server needs --insecure set (see setup.sh) so it serves plain HTTP
# without redirecting to HTTPS -- Traefik already terminates TLS at the edge
# on the websecure entrypoint, so a backend-side redirect-to-HTTPS would
# loop forever (the backend never sees a TLS connection to redirect away
# from).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.phaseolus.local`)
      kind: Rule
      priority: 100
      services:
        - name: argocd-server
          port: 80
  tls: {}
