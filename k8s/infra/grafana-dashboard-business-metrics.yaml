# Discovered by the kube-prometheus-stack Grafana sidecar (LABEL=grafana_dashboard,
# NAMESPACE=ALL), so this can live in `infra` alongside the rest of this meta repo's
# infra manifests regardless of which namespace Grafana itself runs in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-business-metrics
  namespace: infra
  labels:
    grafana_dashboard: "1"
data:
  business-metrics.json: |
    {
      "title": "Phaseolus Business Metrics",
      "uid": "phaseolus-business-metrics",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Orders placed",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "suffix: ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "round(sum(increase(orders_placed_total[5m])))",
              "legendFormat": "Orders placed",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Payments: succeeded vs failed",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "suffix: ops" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Succeeded" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "Failed" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] }
            ]
          },
          "targets": [
            { "expr": "round(sum(increase(payments_succeeded_total[5m])))", "legendFormat": "Succeeded", "refId": "A" },
            { "expr": "round(sum(increase(payments_failed_total[5m])))", "legendFormat": "Failed", "refId": "B" }
          ]
        },
        {
          "id": 3,
          "title": "Orders cooking: started vs finished",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "suffix: ops" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Started cooking" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
              { "matcher": { "id": "byName", "options": "Cooked" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] }
            ]
          },
          "targets": [
            { "expr": "round(sum(increase(orders_cooking_started_total[5m])))", "legendFormat": "Started cooking", "refId": "A" },
            { "expr": "round(sum(increase(orders_cooked_total[5m])))", "legendFormat": "Cooked", "refId": "B" }
          ]
        },
        {
          "id": 4,
          "title": "Notifications sent",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "suffix: ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "round(sum(increase(notifications_sent_total[5m])))",
              "legendFormat": "Notifications sent",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Total orders placed",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "targets": [{ "expr": "round(sum(increase(orders_placed_total[$__range])) or vector(0))", "refId": "A" }]
        },
        {
          "id": 6,
          "title": "Payments succeeded",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none", "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "targets": [{ "expr": "round(sum(increase(payments_succeeded_total[$__range])) or vector(0))", "refId": "A" }]
        },
        {
          "id": 7,
          "title": "Payments failed",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none", "color": { "mode": "fixed", "fixedColor": "red" } }, "overrides": [] },
          "targets": [{ "expr": "round(sum(increase(payments_failed_total[$__range])) or vector(0))", "refId": "A" }]
        },
        {
          "id": 8,
          "title": "Orders cooked",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "targets": [{ "expr": "round(sum(increase(orders_cooked_total[$__range])) or vector(0))", "refId": "A" }]
        },
        {
          "id": 9,
          "title": "Notifications sent",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "targets": [{ "expr": "round(sum(increase(notifications_sent_total[$__range])) or vector(0))", "refId": "A" }]
        },
        {
          "id": 10,
          "title": "Payment success rate",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 20, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 50 },
                  { "color": "green", "value": 90 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * sum(increase(payments_succeeded_total[$__range])) / clamp_min(sum(increase(payments_succeeded_total[$__range])) + sum(increase(payments_failed_total[$__range])), 1)",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      }
    }
