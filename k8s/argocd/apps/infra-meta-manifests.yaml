apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-meta-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mattyrab/M321_TBZ_Phaseolus_Express.git
    targetRevision: main
    path: k8s/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
