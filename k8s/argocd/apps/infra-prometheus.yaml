# Adopts the kube-prometheus-stack release already installed manually in
# Step 2 (Prometheus + Grafana + Alertmanager + kube-state-metrics +
# node-exporter). Values replicate that `helm install` exactly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.8.2
    helm:
      valuesObject:
        grafana:
          adminPassword: phaseolus
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
