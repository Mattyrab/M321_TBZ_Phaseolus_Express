apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beanapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Timposter8107/M321_TBZ_Phaseolus_WebApp.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: phaseolus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
